name: HUMANITY ONE Encrypted Backup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: humanity-one-encrypted-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Create encrypted backup
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HUMANITY_ONE_REPO_URL: https://github.com/o6384051-cpu/humanity-one.git
      BACKUP_SKIP_S3: "1"
      BACKUP_OUTPUT_DIR: ${{ runner.temp }}/humanity-one-backup
      TMPDIR: ${{ runner.temp }}

    steps:
      - name: Checkout reviewed backup branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install pinned Python crypto dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/backup-venv"
          "$RUNNER_TEMP/backup-venv/bin/python" -m pip install --disable-pip-version-check cryptography==46.0.4
          echo "$RUNNER_TEMP/backup-venv/bin" >> "$GITHUB_PATH"

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@41.7.2

      - name: Validate required secrets without printing values
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.HUMANITY_ONE_DATABASE_URL }}
          BACKUP_ENCRYPTION_PIN: ${{ secrets.BACKUP_ENCRYPTION_PIN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$DATABASE_URL" ]] || { echo "::error::Missing repository secret HUMANITY_ONE_DATABASE_URL"; exit 1; }
          [[ "$BACKUP_ENCRYPTION_PIN" =~ ^[0-9]{12,}$ ]] || { echo "::error::BACKUP_ENCRYPTION_PIN must contain at least 12 digits"; exit 1; }
          [[ -n "$VERCEL_TOKEN" ]] || { echo "::error::Missing repository secret VERCEL_TOKEN"; exit 1; }

      - name: Test authenticated encryption
        shell: bash
        env:
          BACKUP_ENCRYPTION_PIN: ${{ secrets.BACKUP_ENCRYPTION_PIN }}
        run: |
          set -euo pipefail
          printf 'HUMANITY ONE backup crypto self-test' > "$RUNNER_TEMP/plain.txt"
          python3 scripts/backup/backup-crypto.py encrypt "$RUNNER_TEMP/plain.txt" "$RUNNER_TEMP/test.enc"
          python3 scripts/backup/backup-crypto.py decrypt "$RUNNER_TEMP/test.enc" "$RUNNER_TEMP/recovered.txt"
          cmp "$RUNNER_TEMP/plain.txt" "$RUNNER_TEMP/recovered.txt"
          python3 - "$RUNNER_TEMP/test.enc" "$RUNNER_TEMP/tampered.enc" <<'PY'
          import pathlib, sys
          data = bytearray(pathlib.Path(sys.argv[1]).read_bytes())
          data[-1] ^= 1
          pathlib.Path(sys.argv[2]).write_bytes(data)
          PY
          if python3 scripts/backup/backup-crypto.py decrypt "$RUNNER_TEMP/tampered.enc" "$RUNNER_TEMP/should-not-exist.txt"; then
            echo "::error::Tampered backup was incorrectly accepted"
            exit 1
          fi
          echo "Authenticated encryption self-test passed."

      - name: Run encrypted backup
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.HUMANITY_ONE_DATABASE_URL }}
          BACKUP_ENCRYPTION_PIN: ${{ secrets.BACKUP_ENCRYPTION_PIN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$BACKUP_OUTPUT_DIR"
          bash scripts/backup/humanity-one-full-backup.sh

      - name: Upload encrypted archive only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: humanity-one-encrypted-backup-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/humanity-one-backup/*.tar.gz.enc
            ${{ runner.temp }}/humanity-one-backup/*.tar.gz.enc.sha256
          if-no-files-found: error
          retention-days: 7
