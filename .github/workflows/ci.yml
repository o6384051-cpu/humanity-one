name: HUMANITY ONE CI

on:
  pull_request:
    branches: [main, feat/account-cloud-sync-preferences]
  push:
    branches: [main, feat/opportunity-center-hardening, fix/local-data-recovery, feat/account-cloud-sync-preferences, fix/workspace-restore-rollback]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run security regression guards
        run: node --test tests/security-regressions.test.mjs tests/workspace-sync-regressions.test.mjs tests/workspace-restore.test.mjs
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Build application
        run: npm run build
