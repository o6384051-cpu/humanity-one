name: HUMANITY ONE CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/opportunity-center-hardening, fix/local-data-recovery]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate backup Bash syntax
        shell: bash
        run: |
          for file in scripts/backup/*.sh; do
            if [[ -f "$file" ]]; then bash -n "$file"; fi
          done
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Lint backup scripts
        run: shellcheck --severity=warning scripts/backup/*.sh
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run security regression guards
        run: node --test tests/security-regressions.test.mjs
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Build application
        run: npm run build
