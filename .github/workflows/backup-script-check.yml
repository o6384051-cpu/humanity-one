name: Backup script validation

on:
  pull_request:
    paths:
      - "scripts/backup/**"
      - ".github/workflows/backup-script-check.yml"
  push:
    branches: [main]
    paths:
      - "scripts/backup/**"
      - ".github/workflows/backup-script-check.yml"

jobs:
  shell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash syntax
        shell: bash
        run: |
          for file in scripts/backup/*.sh; do
            if [[ -f "$file" ]]; then bash -n "$file"; fi
          done
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Run ShellCheck
        run: shellcheck --severity=warning scripts/backup/*.sh
